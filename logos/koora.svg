    <line x1="40" y1="26" x2="48" y2="22" stroke="#101216" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="37" y1="36" x2="44" y2="44" stroke="#101216" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="27" y1="36" x2="20" y2="44" stroke="#101216" stroke-width="2.5" stroke-linecap="round"/>
